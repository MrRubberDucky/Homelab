# Authorization is only implemented for fluxer-gateway
# If you add authorization { token: hex32 } then every other container relying on NATS will fail
# as they have no logic to read the token from .env
listen: "0.0.0.0:4222"
# Limiting resource usage of NATS to be something more sane instead of maxing out whole host by default and bloating swap file
jetstream {
    store_dir: "/data"
    max_memory_store: 4GB
    max_file_store: 40GB
}
