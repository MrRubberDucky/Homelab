# Secure defaults that I've followed using some guide from people who apparently specialized in deploying TURN servers professionally
# This is no longer running or used so leaving this here so it helps somebody else I guess
listening-ip=0.0.0.0
listening-ip=::
listening-port=3478
tls-listening-port=5349
no-tcp-relay
no-rfc5780

# Both IPv4 and IPv6 should relay and expose
# Replace placeholders
relay-ip=vps_public_ipv4
relay-ip=vps_public_ipv6
external-ip=vps_public_ipv4
min-port=50201
max-port=50301

# Authentication
use-auth-secret
static-auth-secret=auth_secret_placeholder
static-auth-secret=auth_secret_placeholder
realm=turn.rubberverse.xyz

# Deny private IPs
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.31.196.0-192.31.196.255
denied-peer-ip=192.52.193.0-192.52.193.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=192.175.48.0-192.175.48.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=100::1:0:0:0:0-100::1:ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2620:4f:8000::-2620:4f:8000:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=3fff::-3fff:fff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=5f00::-5f00:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Special case peer allowance for host itself + WG LAN
allowed-peer-ip=wg_tunnel_ipv4
allowed-peer-ip=vps_public_ipv4
allowed-peer-ip=vps_public_ipv6

# TLS/DTLS
cert=/app/certs/public.pem
pkey=/app/certs/private.pem
cipher-list="HIGH"

# Rate limiting
user-quota=100
total-quota=10000
max-allocate-lifetime=3600
max-bps=10000000
bps-capacity=1000000000

# Security options
no-cli
no-software-attribute
stale-nonce=600
verbose
